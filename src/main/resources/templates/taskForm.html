<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>新規タスク作成</title>
	<link href="/bootstrap/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<header th:replace="~{header}"></header>

	<main class="container my-5" style="max-width: 800px;">
		<h1 class="h4 mb-4 text-secondary border-bottom pb-2">新規タスク作成</h1>

		<th:block th:if="${errorList}">
			<div class="alert alert-danger shadow-sm mb-4" role="alert">
				<ul class="mb-0 ps-3">
					<li th:each="error : ${errorList}" th:text="${error}">エラーメッセージ</li>
				</ul>
			</div>
		</th:block>

		<form action="/tasks/create" method="post">
			<div class="card shadow-sm mb-4 overflow-hidden">
				<div class="table-responsive">
					<table class="table align-middle mb-0">
						<tbody>
							<tr>
								<th class="table-dark text-white fw-normal" style="width: 25%;">カテゴリー</th>
								<td>
									<div class="form-check form-check-inline">
										<input class="form-check-input" type="radio" name="categoryId"
											id="categoryDaily" value="2" checked>
										<label class="form-check-label" for="categoryDaily">日常</label>
									</div>
									<div class="form-check form-check-inline">
										<input class="form-check-input" type="radio" name="categoryId" id="categoryWork"
											value="1">
										<label class="form-check-label" for="categoryWork">仕事</label>
									</div>
								</td>
							</tr>
							<tr>
								<th class="table-dark text-white fw-normal">タイトル</th>
								<td>
									<input type="text" class="form-control" name="title" id="title"
										th:value="${task.title}" placeholder="タスクのタイトルを入力">
								</td>
							</tr>
							<tr>
								<th class="table-dark text-white fw-normal">タスク開始日</th>
								<td>
									<input type="date" class="form-control" name="date" id="date"
										style="max-width: 240px;"
										th:value="${task.date != null ? #temporals.format(task.date, 'yyyy-MM-dd') : ''}">
								</td>
							</tr>
							<tr>
								<th class="table-dark text-white fw-normal">期限</th>
								<td>
									<input type="date" class="form-control" name="closingDate" id="closingDate"
										style="max-width: 240px;"
										th:value="${task.closingDate != null ? #temporals.format(task.closingDate, 'yyyy-MM-dd') : ''}">
								</td>
							</tr>
							<tr>
								<th class="table-dark text-white fw-normal">予定所要時間</th>
								<td>
									<div class="input-group" style="max-width: 160px;">
										<input type="number" class="form-control" name="time" id="time"
											th:value="${task.time}" placeholder="0">
										<span class="input-group-text">分</span>
									</div>
								</td>
							</tr>
							<tr>
								<th class="table-dark text-white fw-normal">メモ</th>
								<td>
									<textarea class="form-control" name="memo" id="memo" rows="3" placeholder="詳細を入力"
										th:text="${task.memo}"></textarea>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<input type="hidden" name="progress" value="0">

			<div class="d-flex gap-2 justify-content-end">
				<a href="/tasks" class="btn btn-outline-secondary px-4">戻る</a>
				<button type="submit" class="btn btn-primary px-4 shadow-sm">新規作成</button>
			</div>

		</form>
	</main>

	<script src="/bootstrap/bootstrap.min.js"></script>
</body>

</html>
