<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>新規タスク作成</title>
    <link href="/bootstrap/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- 共通ヘッダーの埋め込み -->
    <header th:replace="~{header}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- カード型のコンテナ -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4 fw-bold text-dark border-bottom pb-2">新規タスク作成</h1>
                        
                        <form action="/tasks/create" method="post">
                            
                            <!-- カテゴリー (ラジオボタン) -->
                            <div class="mb-3">
                                <label class="form-label d-block fw-semibold">カテゴリー</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="categoryId" id="categoryDaily" value="2" checked>
                                    <label class="form-check-label" for="categoryDaily">日常</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="categoryId" id="categoryWork" value="1">
                                    <label class="form-check-label" for="categoryWork">仕事</label>
                                </div>
                            </div>

                            <!-- タイトル -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="title">タイトル</label>
                                <input type="text" class="form-control" name="title" id="title" th:value="${task.title}" placeholder="タスク名を入力">
                            </div>

                            <!-- 日付エリア (2カラム並列) -->
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-semibold" for="date">タスク開始日</label>
                                    <input type="date" class="form-control" name="date" id="date"
                                        th:value="${task.date != null ? #temporals.format(task.date, 'yyyy-MM-dd') : ''}">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold" for="closingDate">期限</label>
                                    <input type="date" class="form-control" name="closingDate" id="closingDate"
                                        th:value="${task.closingDate != null ? #temporals.format(task.closingDate, 'yyyy-MM-dd') : ''}">
                                </div>
                            </div>

                            <!-- 予定所要時間 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="time">予定所要時間</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" name="time" id="time" th:value="${task.time}" placeholder="0">
                                    <span class="input-group-text">分</span>
                                </div>
                            </div>

                            <!-- メモ -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold" for="memo">メモ</label>
                                <textarea class="form-control" name="memo" id="memo" rows="3" placeholder="詳細を入力" th:text="${task.memo}"></textarea>
                            </div>

                            <!-- 隠しフィールド -->
                            <input type="hidden" name="progress" value="0">

                            <!-- エラーメッセージ -->
                            <div th:if="${errorList}" class="alert alert-danger py-2 mb-3">
                                <p th:each="error:${errorList}" th:text="${error}" class="mb-0 small"></p>
                            </div>

                            <!-- 送信ボタン -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary fw-bold py-2">新規作成</button>
                            </div>
                            
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/bootstrap/bootstrap.min.js"></script>
</body>

</html>
