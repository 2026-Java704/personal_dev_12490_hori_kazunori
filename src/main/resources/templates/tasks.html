<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>タスク一覧</title>
	<link href="/bootstrap/bootstrap.min.css" rel="stylesheet">
</head>

<header th:replace="~{header}"></header>



<body class="bg-light">
	<main class="container my-4">

		<!-- ページタイトルと新規作成ボタン -->
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="h3 mb-0 text-secondary">タスク一覧</h1>
			<form th:action="@{/tasks/create}" method="get">
				<button class="btn btn-primary shadow-sm">＋ 新規作成</button>
			</form>
		</div>

		<!-- 並び替えエリア -->
		<div class="card shadow-sm mb-4">
			<div class="card-body py-2">
				<form action="/tasks" method="get" class="row g-3 align-items-center">

					<div class="col-auto d-flex align-items-center">
						<span class="fw-bold text-muted small me-3">カテゴリー：</span>

						<div class="d-flex align-items-center gap-3">
							<div class="form-check form-check-inline mb-0 d-flex align-items-center">
								<input class="form-check-input me-1" type="radio" name="categoryId" id="catAll"
									value="0" th:checked="${selectedCategoryId == 0}">
								<label class="form-check-label small" for="catAll">全て</label>
							</div>

							<div class="form-check form-check-inline mb-0 d-flex align-items-center"
								th:each="category : ${categories}">
								<input class="form-check-input me-1" type="radio" name="categoryId"
									th:id="'cat-' + ${category.categoryId}" th:value="${category.categoryId}"
									th:checked="${selectedCategoryId == category.categoryId}">
								<label class="form-check-label small" th:for="'cat-' + ${category.categoryId}"
									th:text="${category.categoryName}">
									カテゴリー名
								</label>
							</div>
						</div>
					</div>

					<div class="col-auto d-flex align-items-center ms-2">
						<span class="fw-bold text-muted small me-3">並び順：</span>

						<div class="d-flex align-items-center gap-3">
							<div class="form-check form-check-inline mb-0 d-flex align-items-center">
								<input class="form-check-input me-1" type="radio" name="sort" id="sortAsc" value="asc"
									th:checked="${selectedSort == 'asc'}">
								<label class="form-check-label small" for="sortAsc">昇順</label>
							</div>

							<div class="form-check form-check-inline mb-0 d-flex align-items-center">
								<input class="form-check-input me-1" type="radio" name="sort" id="sortDesc" value="desc"
									th:checked="${selectedSort == 'desc'}">
								<label class="form-check-label small" for="sortDesc">降順</label>
							</div>
						</div>
					</div>

					<div class="col-auto">
						<button class="btn btn-outline-secondary btn-sm">並び替え</button>
					</div>
				</form>
			</div>
		</div>



		<!-- タスクが存在しない場合の表示 -->
		<th:block th:unless="${showContent}">
			<div class="alert alert-info text-center shadow-sm" role="alert">
				タスクを登録してください
			</div>
		</th:block>

		<!-- タスクが存在する場合の表示 -->
		<th:block th:if="${showContent}">
			<form method="post">

				<!-- 丸角・シャドウ付きのカードにする -->
				<div class="card shadow-sm mb-4 overflow-hidden">
					<div class="table-responsive">
						<table class="table table-hover align-middle mb-0">
							<thead class="table-dark">
								<tr>
									<th scope="col" style="width: 40px;"></th>
									<th scope="col">カテゴリー</th>
									<th scope="col">タイトル</th>
									<th scope="col">進捗状況</th>
									<th scope="col">予想時間</th>
									<th scope="col">開始日</th>
									<th scope="col">期限</th>
									<th scope="col">メモ</th>
									<th scope="col" class="text-center">更新</th>
									<th scope="col" class="text-center">削除</th>
								</tr>
							</thead>
							<tbody>
								<!-- 1つ目のループ：日付ごとにMapのデータを1つずつ取り出す -->
								<th:block th:each="entry : ${tasksByDate}" th:with="dayTasks=${entry.value}">

									<!-- 日付 + 日ごとの合計時間を表示する(仕切り行) -->
									<tr class="table-light fw-bold text-secondary border-bottom-2">
										<td colspan="10" class="py-2 px-3 bg-light">
											<i class="bi bi-calendar3 me-1"></i>
											<span
												th:text="${#temporals.format(entry.key, 'yyyy/MM/dd')}">2026/01/01</span>
											<span class="badge bg-secondary ms-2">
												合計時間: <span
													th:text="${#aggregates.sum(dayTasks.?[progress != 2].![time]) ?: 0}">0</span>
												分
											</span>
										</td>
									</tr>

									<!-- 2つ目のループ：その日付に紐づくタスクを1行ずつ表示 -->
									<tr th:each="task : ${dayTasks}">
										<td class="text-center">
											<input class="form-check-input" type="checkbox" name="selectedTasksId"
												th:value="${task.taskId}">
										</td>
										<!-- カテゴリーごとの装飾 -->
										<td>
											<th:block th:switch="${task.categoryId}">
												<span th:case="'1'" class="badge bg-info text-dark">仕事</span>
												<span th:case="'2'" class="badge bg-warning text-dark">日常</span>
											</th:block>
										</td>
										<td>
											<span class="fw-bold text-dark" th:text="${task.title}">タイトル</span>
										</td>
										<!-- 進捗状況ごとの色分け -->
										<td>
											<th:block th:switch="${task.progress}">
												<span th:case="'0'" class="badge bg-secondary">未着手</span>
												<span th:case="'1'" class="badge bg-primary">進行中</span>
												<span th:case="'2'" class="badge bg-success">完了</span>
											</th:block>
										</td>

										<td th:text="${task.time} + '分'" class="text-muted small">分</td>
										<td th:text="${task.dateFormatted}" class="text-muted small"></td>
										<td th:text="${task.closingDateFormatted}" class="text-muted small"></td>
										<td th:text="${task.memo}" class="text-truncate" style="max-width: 200px;"></td>

										<td class="text-center">
											<a th:href="@{/tasks/{taskId}/edit(taskId=${task.taskId})}"
												class="btn btn-outline-primary btn-sm">
												更新
											</a>
										</td>

										<td class="text-center">
											<button type="submit"
												th:formaction="@{/tasks/{taskId}/delete(taskId=${task.taskId})}"
												th:data-confirm-message="タスクを削除します。よろしいですか？"
												onclick="return confirm(this.getAttribute('data-confirm-message'));"
												class="btn btn-outline-danger btn-sm">
												削除
											</button>
										</td>
									</tr>
								</th:block>
							</tbody>
						</table>
					</div>
				</div>

				<!-- 下部の一括操作ボタン群 -->
				<div class="d-flex flex-wrap gap-2 justify-content-end mb-5">
					<button type="submit" th:formaction="@{/tasks/batch-update}"
						onclick="return confirm('選択したタスクの進捗状況を進めます。よろしいですか？\n\n未着手 → 進行中\n進行中 → 完了\n\nに変更されます');"
						class="btn btn-success shadow-sm">
						まとめて進捗更新
					</button>
					<button type="submit" th:formaction="@{/tasks/batch-delete}"
						onclick="return confirm('選択したタスクを削除します。よろしいですか？');" class="btn btn-danger shadow-sm">
						まとめて削除
					</button>
					<button type="submit" th:formaction="@{/tasks/delete-completed}"
						onclick="return confirm('完了済みのタスクをすべて削除します。よろしいですか？');"
						class="btn btn-outline-danger shadow-sm">
						完了タスク一括削除
					</button>
				</div>
			</form>
		</th:block>
	</main>

	<script src="/bootstrap/bootstrap.min.js"></script>
</body>

</html>
