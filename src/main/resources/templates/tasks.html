<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>タスク一覧</title>
</head>

<header th:replace="~{header}"></header>
<hr>

<body>
	<nav>
		<form action="/tasks" method="get">
			<input type="radio" name="categoryId" value="3" checked>全て
			<input type="radio" name="categoryId" value="2">日常
			<input type="radio" name="categoryId" value="1">仕事
			<button>並び替え</button>
		</form>
	</nav>
	<main>
		<th:block th:unless="${showContent}">
			<table>
				<tr>
					<th>タスクを登録してください</th>
				</tr>
			</table>
		</th:block>

		<th:block th:if="${showContent}">
			<form method="get">
				<table>
					<tr>
						<th></th>
						<th>カテゴリー</th>
						<th>タイトル</th>
						<th>進捗状況</th>
						<th>開始日</th>
						<th>期限</th>
						<th>メモ</th>
						<th>更新</th>
						<th>削除</th>
					</tr>
					<!-- 1つ目のループ：日付ごとにMapのデータを1つずつ取り出す -->
					<th:block th:each="entry : ${tasksByDate}" th:with="dayTasks=${entry.value}">

						<!-- 日付 + 日ごとの合計時間を表示する行 -->
						<tr style="background-color: #f5f5f5; font-weight: bold;">
							<td colspan="9">
								<!-- 'yyyy/MM/dd' 形式に変更 -->
								<span th:text="${#temporals.format(entry.key, 'yyyy/MM/dd')}">2026/01/01</span>
								（合計時間: <span th:text="${#aggregates.sum(dayTasks.![time])}">0</span>分）
							</td>
						</tr>

						<!-- 2つ目のループ：その日付に紐づくタスクを1行ずつ表示 -->
						<tr th:each="task : ${dayTasks}">
							<td>
								<label>
									<input type="checkbox" name="selectedTasks" th:value="${task.taskId}">
								</label>
							</td>
							<th:block th:switch="${task.categoryId}">
								<td th:case="'1'">仕事</td>
								<td th:case="'2'">日常</td>
							</th:block>
							<td><a th:text="${task.title}"></a></td>
							<th:block th:switch="${task.progress}">
								<td th:case="'0'">未着手</td>
								<td th:case="'1'">進行中</td>
								<td th:case="'2'">完了</td>
							</th:block>

							<td th:text="${task.dateFormatted}"></td>
							<td th:text="${task.closingDateFormatted}"></td>

							<td th:text="${task.memo}"></td>
							<td>
								<form th:action="@{/tasks/{taskId}/edit(taskId=${task.taskId})}" method="get">
									<button>更新</button>
								</form>
							</td>
							<td>
								<form th:action="@{/tasks/{taskId}/delete(taskId=${task.taskId})}" method="post"
									th:onsubmit="return confirm('本当に削除しますか？');">
									<button type="submit">削除</button>
								</form>
							</td>
						</tr>
					</th:block>
				</table>

				<div>
					<!-- th:formaction を使うと、押したボタンに応じたURLへデータを送信できる -->
					<button type="submit" th:formaction="@{/tasks/batch-update}">まとめて更新</button>
					<button type="submit" th:formaction="@{/tasks/batch-delete}">まとめて削除</button>
				</div>
			</form>
		</th:block>
		<form th:action="@{/tasks/create}" method="get">
			<button>新規作成</button>
		</form>
	</main>
</body>

</html>
